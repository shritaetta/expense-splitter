version: '3.8'

services:
  api:
    build:
      context: ./ExpenseSplitter.Api
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/app.db
    volumes:
      - app-data:/app/data

volumes:
  app-data:
