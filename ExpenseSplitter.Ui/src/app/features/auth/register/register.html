<div class="container" style="max-width: 450px; margin-top: 5rem;">
  <div class="card">
    <h1 class="card-title text-center" style="color: var(--primary); margin-bottom: 0;">Create Account</h1>
    <p class="text-center">Join Expense Splitter</p>
    
    @if (error) {
      <div class="form-group" style="color: var(--danger); background: rgb(239 68 68 / 10%); padding: 10px; border-radius: var(--radius-sm);">
        {{ error }}
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="name" placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="••••••••" />
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" [disabled]="registerForm.invalid">
        Register
      </button>
    </form>

    <div class="text-center" style="margin-top: 1.5rem; font-size: 0.875rem;">
      <span style="color: var(--text-muted);">Already have an account?</span> 
      <a routerLink="/login" style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign In</a>
    </div>
  </div>
</div>
