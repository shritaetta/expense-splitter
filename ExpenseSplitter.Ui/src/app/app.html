<nav class="navbar">
  <a routerLink="/" class="navbar-brand">💸 Expense Splitter</a>
  
  <div class="nav-links">
    @if (currentUser$ | async; as user) {
      <span style="color: var(--text-main); font-weight: 500; display: flex; align-items: center; gap: 0.5rem;">
        <span style="width: 24px; height: 24px; border-radius: 50%; background: var(--primary); display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem;">
          {{ user.name.charAt(0).toUpperCase() }}
        </span>
        {{ user.name }}
      </span>
      <a style="cursor: pointer;" class="nav-link" (click)="logout()">Logout</a>
    } @else {
      <a routerLink="/login" class="nav-link">Sign In</a>
      <a routerLink="/register" class="btn btn-primary" style="padding: 0.5rem 1rem;">Sign Up</a>
    }
  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>
